version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: railpulse-postgres
    environment:
      POSTGRES_DB: railpulse_eta
      POSTGRES_USER: railpulse
      POSTGRES_PASSWORD: railpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railpulse -d railpulse_eta"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railpulse-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/railpulse_eta
      SPRING_DATASOURCE_USERNAME: railpulse
      SPRING_DATASOURCE_PASSWORD: railpulse
      APP_DEMO_ENABLED: "true"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: railpulse-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:

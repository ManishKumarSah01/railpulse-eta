server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: railpulse-eta
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:railpulse_eta}
    username: ${DB_USERNAME:railpulse}
    password: ${DB_PASSWORD:railpulse}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  demo:
    enabled: ${APP_DEMO_ENABLED:true}
  model:
    path: ${MODEL_PATH:}
  data:
    source: ${DATA_SOURCE:demo}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
